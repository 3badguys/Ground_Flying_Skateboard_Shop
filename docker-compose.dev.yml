# Development overrides — use with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  skateboard-backend:
    build:
      target: development
    ports:
      - "3000:3000"
    command: >
      sh -c "npx prisma migrate deploy && npx nest start --watch"
    volumes:
      - ./packages/backend/src:/app/packages/backend/src
      - ./packages/backend/prisma:/app/packages/backend/prisma

  skateboard-frontend:
    build:
      target: development
    ports:
      - "5173:5173"
    environment:
      VITE_API_TARGET: "http://skateboard-backend:3000"
    command: npx vite --host 0.0.0.0
    volumes:
      - ./packages/frontend/src:/app/packages/frontend/src
      - ./packages/frontend/index.html:/app/packages/frontend/index.html
      - ./packages/frontend/vite.config.ts:/app/packages/frontend/vite.config.ts
      - ./packages/frontend/.env:/app/packages/frontend/.env:ro
      - ./packages/frontend/public:/app/packages/frontend/public
