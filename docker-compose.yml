services:
  skateboard-postgres:
    image: postgres:16-alpine
    container_name: skateboard-postgres
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: skateboard_shop
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - shared_gateway_net

  skateboard-backend:
    build:
      context: ./packages/backend
      target: production
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: skateboard-backend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
      DATABASE_URL: "postgresql://postgres:admin123@skateboard-postgres:5432/skateboard_shop"
      PORT: 3000
    depends_on:
      skateboard-postgres:
        condition: service_started
    networks:
      - shared_gateway_net

  skateboard-frontend:
    build:
      context: ./packages/frontend
      target: production
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: skateboard-frontend
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
    depends_on:
      - skateboard-backend
    networks:
      - shared_gateway_net

  skateboard-ngrok:
    image: ngrok/ngrok:latest
    container_name: skateboard-ngrok
    restart: unless-stopped
    profiles: [optional]
    ports:
      - "4040:4040"
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: http skateboard-frontend:80
    depends_on:
      - skateboard-frontend
    networks:
      - shared_gateway_net

volumes:
  pg_data:

networks:
  shared_gateway_net:
    external: true
